name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The completion scripts are run in every shell that is there (see
    # tests/completions/README.md); bash and pwsh come with the image.
    - name: Shells for the completion tests
      run: sudo apt-get update && sudo apt-get install -y zsh fish
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # The vendored tiny_http is no workspace member: its own tests (the
    # changes rusk made to it, see vendor/README.md) run on request.
    - name: Run the vendored tiny_http tests
      run: cargo test -p tiny_http --lib --verbose

