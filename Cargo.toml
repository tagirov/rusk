[package]
name = "rusk"
version = "0.7.3"
authors = ["github.com/tagirov/rusk/graphs/contributors"]
edition = "2024"
# let-chains (`if let … && let …`) are stable from 1.88, `File::try_lock`
# from 1.89 (REVIEW №143); clippy's `incompatible_msrv` lint checks the std
# APIs the code uses against it.
rust-version = "1.89"
description = "Minimal cross-platform terminal task manager"

[lib]
name = "rusk"
path = "src/lib.rs"

[[bin]]
name = "rusk"
path = "src/main.rs"

[features]
default = [
    "completions",
    "interactive",
    "web",
    "sync",
    "fmt-markdown",
    "fmt-todotxt",
    "fmt-ndjson",
    "fmt-ics",
    "backend-http",
    "backend-ssh",
    "backend-git",
]
completions = []
interactive = ["dep:crossterm", "dep:arboard"]
web = ["dep:tiny_http"]
# `rusk sync` shares the ssh/http transports with the remote database backends.
sync = ["backend-ssh", "backend-http"]
# Database file formats (selected by the rusk_db file extension).
fmt-markdown = []
fmt-todotxt = []
fmt-ndjson = []
fmt-ics = []
# Database storage backends (selected by the shape of rusk_db).
# backend-sqlite is off by default: it pulls in a bundled C library.
backend-sqlite = ["dep:rusqlite"]
backend-http = []
backend-ssh = []
backend-git = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dirs = "6.0"
tiny_http = { version = "0.12", optional = true }
crossterm = { version = "0.29", optional = true }
arboard = { version = "3.4", optional = true, default-features = false, features = [
    "wayland-data-control",
] }
rusqlite = { version = "0.40", optional = true, features = ["bundled", "serialize"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"

[target.'cfg(unix)'.dependencies]
# Only for the terminating signals the editor has to survive (see
# `cli::editor::terminal`): a SIGTERM must put the terminal back and keep
# what was typed, not leave the shell in raw mode.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.0"

# tiny_http as published, with rusk's changes: an unread request body is
# thrown away through a small buffer, not one as large as its
# `Content-Length` (a petabyte announced by a client aborted the server);
# every connection of a burst is read; and limits — a timeout, a pace for
# bodies and answers, a cap on connections, one request at a time — which
# the crate has none of. See vendor/README.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
