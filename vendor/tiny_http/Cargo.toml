# tiny_http 0.12.0, vendored with one change (see ../README.md). The
# manifest is the crate's own without its dev-dependencies, examples,
# benches and integration tests, which are not vendored.
[package]
name = "tiny_http"
version = "0.12.0"
authors = ["pierre.krieger1708@gmail.com",
           "Corey Farwell <coreyf@rwell.org>"]
description = "Low level HTTP server library"
documentation = "https://tiny-http.github.io/tiny-http/tiny_http/index.html"
keywords = ["http", "server", "web"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"
edition = "2018"

[features]
default = []
ssl = ["ssl-openssl"]
ssl-openssl = ["openssl", "zeroize"]
ssl-rustls = ["rustls", "rustls-pemfile", "zeroize"]

[dependencies]
ascii = "1.0"
chunked_transfer = "1"
log = "0.4.4"
httpdate = "1.0.2"

openssl = { version = "0.10", optional = true }
rustls = { version = "0.20", optional = true }
rustls-pemfile = { version = "0.2.1", optional = true }
zeroize = { version = "1", optional = true }

# rusk: cargo caps the lints of registry crates, not of path ones; these two
# are upstream's (`SequentialWriter` re-exported and unused, the trait
# `MustBeShareDummy` never used).
[lints.rust]
unused_imports = "allow"
dead_code = "allow"
